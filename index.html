<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Adrenalina Completa 3D (C9H13NO3)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #f9fafb; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        .hud {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            background: rgba(17, 24, 39, 0.88);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px 16px;
            z-index: 10;
            pointer-events: none;
        }
        .hud-title { font-size: 15px; font-weight: 700; color: #38bdf8; }
        .hud-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
        #inspector {
            position: absolute;
            bottom: 75px; /* Elevado para que nunca quede detrás del banner */
            left: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid #38bdf8;
            border-radius: 12px;
            padding: 14px 16px;
            z-index: 9999;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        #inspector h3 { font-size: 14px; margin-bottom: 4px; color: #38bdf8; }
        #inspector p { font-size: 12px; line-height: 1.4; color: #cbd5e1; }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Ocultar barra flotante de Tiiny Host si es inyectada */
        div[class*="tiiny"], div[id*="tiiny"], iframe[src*="tiiny"] {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div class="hud">
        <div class="hud-title">Adrenalina Completa: C₉H₁₃NO₃ (26 Átomos)</div>
        <div class="hud-sub">Zoom revela electrones y nucleones • Toca cualquier átomo o hidrógeno</div>
    </div>

    <div id="inspector">
        <button class="close-btn" onclick="document.getElementById('inspector').style.display='none'">✕</button>
        <h3 id="insp-name">Átomo</h3>
        <p id="insp-desc">Detalles</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030712, 0.012);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 17);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxDistance = 40;
        controls.minDistance = 1.2;

        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffffff, 0.8, 50);
        pointLight.position.set(-10, -10, -10);
        scene.add(pointLight);

        const atomsData = [
            { id: 'C1', elem: 'C', pos: [-1.4, 0.0, 0.0], hyb: 'sp²', geom: 'Trigonal plana', role: 'Anclaje con cadena lateral de etanolamina' },
            { id: 'C2', elem: 'C', pos: [-2.1, 1.2, 0.0], hyb: 'sp²', geom: 'Trigonal plana', role: 'Carbono aromático C2' },
            { id: 'C3', elem: 'C', pos: [-3.5, 1.2, 0.0], hyb: 'sp²', geom: 'Trigonal plana', role: 'Carbono fenólico meta enlazado a -OH' },
            { id: 'C4', elem: 'C', pos: [-4.2, 0.0, 0.0], hyb: 'sp²', geom: 'Trigonal plana', role: 'Carbono fenólico para enlazado a -OH' },
            { id: 'C5', elem: 'C', pos: [-3.5, -1.2, 0.0], hyb: 'sp²', geom: 'Trigonal plana', role: 'Carbono aromático C5' },
            { id: 'C6', elem: 'C', pos: [-2.1, -1.2, 0.0], hyb: 'sp²', geom: 'Trigonal plana', role: 'Carbono aromático C6' },
            { id: 'H2', elem: 'H', pos: [-1.6, 2.15, 0.0], hyb: '1s', geom: 'Lineal (enlace σ)', role: 'Hidrógeno aromático en C2' },
            { id: 'H5', elem: 'H', pos: [-4.05, -2.15, 0.0], hyb: '1s', geom: 'Lineal (enlace σ)', role: 'Hidrógeno aromático en C5' },
            { id: 'H6', elem: 'H', pos: [-1.6, -2.15, 0.0], hyb: '1s', geom: 'Lineal (enlace σ)', role: 'Hidrógeno aromático en C6' },
            { id: 'O3', elem: 'O', pos: [-4.2, 2.4, 0.1], hyb: 'sp³', geom: 'Angular (~109°)', role: 'Oxígeno fenólico meta con 2 pares solitarios' },
            { id: 'H_O3', elem: 'H', pos: [-3.6, 3.15, 0.1], hyb: '1s', geom: 'Lineal (enlace σ)', role: 'Hidrógeno del grupo -OH meta' },
            { id: 'O4', elem: 'O', pos: [-5.6, 0.0, 0.1], hyb: 'sp³', geom: 'Angular (~109°)', role: 'Oxígeno fenólico para con 2 pares solitarios' },
            { id: 'H_O4', elem: 'H', pos: [-6.0, -0.85, 0.1], hyb: '1s', geom: 'Lineal (enlace σ)', role: 'Hidrógeno del grupo -OH para' },
            { id: 'C7', elem: 'C', pos: [0.1, 0.0, 0.1], hyb: 'sp³', geom: 'Tetraédrica', role: 'Carbono beta quiral (R-estereocentro)' },
            { id: 'H7', elem: 'H', pos: [0.1, -0.4, -0.9], hyb: '1s', geom: 'Lineal (enlace σ)', role: 'Hidrógeno en centro quiral beta' },
            { id: 'O7', elem: 'O', pos: [0.6, 1.2, -0.6], hyb: 'sp³', geom: 'Angular (~108.5°)', role: 'Oxígeno del hidroxilo alifático' },
            { id: 'H_O7', elem: 'H', pos: [1.55, 1.3, -0.5], hyb: '1s', geom: 'Lineal (enlace σ)', role: 'Hidrógeno hidroxílico de anclaje' },
            { id: 'C8', elem: 'C', pos: [0.9, -1.1, 0.7], hyb: 'sp³', geom: 'Tetraédrica', role: 'Carbono alfa espaciador' },
            { id: 'H8A', elem: 'H', pos: [0.8, -2.05, 0.2], hyb: '1s', geom: 'Lineal (enlace σ)', role: 'Hidrógeno en carbono alfa (A)' },
            { id: 'H8B', elem: 'H', pos: [0.55, -1.2, 1.7], hyb: '1s', geom: 'Lineal (enlace σ)', role: 'Hidrógeno en carbono alfa (B)' },
            { id: 'N1', elem: 'N', pos: [2.3, -0.8, 0.4], hyb: 'sp³', geom: 'Piramidal trigonal (~107°)', role: 'Nitrógeno con par solitario básico' },
            { id: 'HN', elem: 'H', pos: [2.4, 0.05, -0.15], hyb: '1s', geom: 'Lineal (enlace σ)', role: 'Hidrógeno de la amina secundaria' },
            { id: 'C9', elem: 'C', pos: [3.2, -1.9, 0.8], hyb: 'sp³', geom: 'Tetraédrica', role: 'Carbono del metilo terminal' },
            { id: 'H9A', elem: 'H', pos: [4.2, -1.6, 0.6], hyb: '1s', geom: 'Lineal (enlace σ)', role: 'Hidrógeno de metilo (A)' },
            { id: 'H9B', elem: 'H', pos: [3.1, -2.8, 0.2], hyb: '1s', geom: 'Lineal (enlace σ)', role: 'Hidrógeno de metilo (B)' },
            { id: 'H9C', elem: 'H', pos: [3.05, -2.1, 1.85], hyb: '1s', geom: 'Lineal (enlace σ)', role: 'Hidrógeno de metilo (C)' }
        ];

        const bondsData = [
            ['C1','C2', 1.5], ['C2','C3', 1.5], ['C3','C4', 1.5],
            ['C4','C5', 1.5], ['C5','C6', 1.5], ['C6','C1', 1.5],
            ['C2','H2', 1], ['C5','H5', 1], ['C6','H6', 1],
            ['C3','O3', 1], ['O3','H_O3', 1],
            ['C4','O4', 1], ['O4','H_O4', 1],
            ['C1','C7', 1], ['C7','H7', 1], ['C7','O7', 1], ['O7','H_O7', 1],
            ['C7','C8', 1], ['C8','H8A', 1], ['C8','H8B', 1],
            ['C8','N1', 1], ['N1','HN', 1], ['N1','C9', 1],
            ['C9','H9A', 1], ['C9','H9B', 1], ['C9','H9C', 1]
        ];

        const elemConfigs = {
            'C': { r: 0.40, col: 0x334155, z: 6, p: 6, n: 6, orb: 6, sym: 'Carbono' },
            'O': { r: 0.36, col: 0xef4444, z: 8, p: 8, n: 8, orb: 8, sym: 'Oxígeno' },
            'N': { r: 0.38, col: 0x3b82f6, z: 7, p: 7, n: 7, orb: 7, sym: 'Nitrógeno' },
            'H': { r: 0.22, col: 0xf1f5f9, z: 1, p: 1, n: 0, orb: 1, sym: 'Hidrógeno' }
        };

        const molGroup = new THREE.Group();
        const orbitalsList = [];
        const interactiveAtoms = [];

        atomsData.forEach(data => {
            const conf = elemConfigs[data.elem];
            const atomRoot = new THREE.Group();
            atomRoot.position.set(...data.pos);

            const shellGeo = new THREE.SphereGeometry(conf.r, 22, 22);
            const shellMat = new THREE.MeshPhongMaterial({
                color: conf.col,
                transparent: true,
                opacity: 0.85,
                shininess: 90
            });
            const shell = new THREE.Mesh(shellGeo, shellMat);
            shell.userData = data;
            atomRoot.add(shell);
            interactiveAtoms.push(shell);

            const nucRoot = new THREE.Group();
            const nucCount = conf.p + conf.n;
            const nuclGeo = new THREE.SphereGeometry(data.elem === 'H' ? 0.05 : 0.035, 8, 8);

            for (let i = 0; i < nucCount; i++) {
                const isProton = i < conf.p;
                const nuclMat = new THREE.MeshBasicMaterial({ color: isProton ? 0xff3b30 : 0x9ca3af });
                const nucleon = new THREE.Mesh(nuclGeo, nuclMat);
                if (nucCount === 1) {
                    nucleon.position.set(0, 0, 0);
                } else {
                    const phi = Math.acos(-1 + (2 * i) / nucCount);
                    const theta = Math.sqrt(nucCount * Math.PI) * phi;
                    const dist = 0.07 * Math.cbrt(i / nucCount);
                    nucleon.position.set(
                        dist * Math.cos(theta) * Math.sin(phi),
                        dist * Math.sin(theta) * Math.sin(phi),
                        dist * Math.cos(phi)
                    );
                }
                nucRoot.add(nucleon);
            }
            atomRoot.add(nucRoot);

            const orbGroup = new THREE.Group();
            const eGeo = new THREE.SphereGeometry(data.elem === 'H' ? 0.022 : 0.025, 8, 8);
            const eMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
            const electrons = [];

            for (let e = 0; e < conf.orb; e++) {
                const electron = new THREE.Mesh(eGeo, eMat);
                const orbitR = conf.r * (0.5 + (e / Math.max(conf.orb, 1)) * 0.45);
                electrons.push({
                    mesh: electron,
                    r: orbitR,
                    speed: 2.2 + Math.random() * 2.8,
                    inc: Math.random() * Math.PI,
                    phase: Math.random() * 6.28
                });
                orbGroup.add(electron);
            }
            atomRoot.add(orbGroup);
            orbitalsList.push({ electrons, shell });

            molGroup.add(atomRoot);
        });
        scene.add(molGroup);

        const atomMap = {};
        atomsData.forEach(a => atomMap[a.id] = new THREE.Vector3(...a.pos));

        bondsData.forEach(([id1, id2, order]) => {
            const p1 = atomMap[id1];
            const p2 = atomMap[id2];
            const dist = p1.distanceTo(p2);
            const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);

            const isHBond = id1.startsWith('H') || id2.startsWith('H');
            const radius = isHBond ? 0.045 : (order === 1.5 ? 0.075 : 0.065);
            const color = isHBond ? 0xcfd8dc : (order === 1.5 ? 0x94a3b8 : 0x64748b);

            const cylGeo = new THREE.CylinderGeometry(radius, radius, dist, 12);
            const cylMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
            const bMesh = new THREE.Mesh(cylGeo, cylMat);
            bMesh.position.copy(mid);
            bMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3().subVectors(p2, p1).normalize());
            scene.add(bMesh);
        });

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(interactiveAtoms);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                const conf = elemConfigs[data.elem];
                document.getElementById('inspector').style.display = 'block';
                document.getElementById('insp-name').innerText = `${conf.sym} (${data.id}) • Hibridación ${data.hyb}`;
                document.getElementById('insp-desc').innerHTML = `
                    <b>Geometría:</b> ${data.geom}<br>
                    <b>Rol bioquímico:</b> ${data.role}<br>
                    <b>Estructura:</b> ${conf.p} Protón${conf.p>1?'es':''} | ${conf.n} Neutrones | ${conf.orb} Electrón${conf.orb>1?'es':''}
                `;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            molGroup.rotation.y = t * 0.12;

            const camDist = camera.position.distanceTo(molGroup.position);
            const zoomRatio = THREE.MathUtils.clamp((camDist - 3.0) / 10, 0.18, 0.85);

            orbitalsList.forEach(item => {
                item.shell.material.opacity = zoomRatio;
                item.electrons.forEach(el => {
                    const angle = t * el.speed + el.phase;
                    el.mesh.position.set(
                        el.r * Math.cos(angle),
                        el.r * Math.sin(angle) * Math.cos(el.inc),
                        el.r * Math.sin(angle) * Math.sin(el.inc)
                    );
                });
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
